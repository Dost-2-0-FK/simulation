bank_user_id = "bank"
resources = ["water", "thermal_oil", "silicon", "uxmal_gas", "uxmal_crystals", "lsc", "solar_energy", "oxygen", "iron", "steel", "genetic_material", "entropy"]

# Price of creating a trust; also determines its destruction loot.
[costs.trust]
money = 600
resources = { water = 20, thermal_oil = 10, solar_energy = 15 }

# Price of creating a military base; also determines its destruction loot.
[costs.base]
money = 1800
resources = { water = 40, solar_energy = 30, steel = 25 }

# Price of producing a military unit; also determines its destruction loot.
[costs.unit]
money = 120
resources = { lsc = 1, oxygen = 3, solar_energy = 2, water = 4 }

# Money and resource output assigned to newly created trusts.
[trust_production]
money = 1
resources = { iron = 1, solar_energy = 1 }

# HTTP bind address and cookie-session signing key.
[server]
bind_address = "127.0.0.1"
port = 8080
auth_cookie_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# MongoDB connection and periodic persistence interval.
[persistence]
uri = "mongodb://localhost:27017"
database = "simulation"
interval_seconds = 30

# URLs of services called by the simulation.
[env]
auth_service_url = "http://127.0.0.1:18081"
credit_exchange_url = "http://127.0.0.1:18080"

# Half-open wrapping map bounds; every placement must start inside them.
[world]
min_x = 0
max_x = 360
min_y = 0
max_y = 180

# Combat, movement, and structure-destruction timing and thresholds.
[combat]
combat_tick_interval_seconds = 1.5
movement_interval_seconds = 60
movement_step = 2.0
base_destruction_threshold = 5
trust_destruction_threshold = 4

# Fraction of each destroyed entity's cost awarded as loot.
[combat.loot_factors]
money = 0.5
resources = { lsc = 0.5, oxygen = 0.5, solar_energy = 0.5, water = 0.5, steel = 0.5 }

