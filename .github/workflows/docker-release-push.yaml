name: Build and push container image on release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.set_build_date.outputs.build_date }}
    steps:
      # Set build date for image tagging. Produces a tag like "2026-08-01-23-22".
      - name: Set build date for image tagging
        id: set_build_date
        run: echo "build_date=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT

  docker-build-scan-push:
    needs: setup
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image_name: simulation
          - dockerfile: Dockerfile.credit-exchanger
            image_name: credit-exchanger
    secrets: inherit
    uses: ./.github/workflows/docker-build-scan-push.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      artifact_registry_url: "exo.container-registry.com"
      artifact_registry_project: "awzmb"
      artifact_registry_image_name: ${{ matrix.image_name }}
      artifact_registry_repository: "infrastructure"
      # PRs build/scan only; release & manual runs push `latest` + the date tag
      # that the Flux ImagePolicies track.
      tags: ${{ github.event_name == 'pull_request' && 'latest' || format('latest,{0}', needs.setup.outputs.build_date) }}
      # PRs build and scan only; never push the image.
      push: ${{ github.event_name != 'pull_request' }}
      # Issue creation is disabled so the workflow needs no write token scopes.
      create_issue: false
