name: Build and push container image on release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build-scan-push:
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image_name: simulation
          - dockerfile: Dockerfile.credit-exchanger
            image_name: credit-exchanger
    secrets: inherit
    uses: ./.github/workflows/docker-build-scan-push.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      artifact_registry_url: "exo.container-registry.com"
      artifact_registry_project: "awzmb"
      artifact_registry_image_name: ${{ matrix.image_name }}
      artifact_registry_repository: "infrastructure"
      # Manual runs (workflow_dispatch) have no release tag, so push just `latest`.
      tags: ${{ github.event_name == 'release' && format('latest,{0}', github.event.release.tag_name) || 'latest' }}
      # PRs build and scan only; never push the image.
      push: ${{ github.event_name != 'pull_request' }}
      # Issue creation is disabled so the workflow needs no write token scopes.
      create_issue: false
