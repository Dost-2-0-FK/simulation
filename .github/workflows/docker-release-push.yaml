name: Build and push container image on release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

jobs:
  docker-build-scan-push:
    secrets: inherit
    uses: ./.github/workflows/docker-build-scan-push.yaml
    with:
      dockerfile: Dockerfile
      artifact_registry_url: "exo.container-registry.com"
      artifact_registry_project: "awzmb"
      artifact_registry_image_name: "simulation"
      artifact_registry_repository: "infrastructure"
      # Manual runs (workflow_dispatch) have no release tag, so push just `latest`.
      tags: ${{ github.event_name == 'release' && format('latest,{0}', github.event.release.tag_name) || 'latest' }}
      # PRs build and scan only: never push the image or open vulnerability issues.
      push: ${{ github.event_name != 'pull_request' }}
      create_issue: ${{ github.event_name != 'pull_request' }}
