services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  credit-exchanger:
    build:
      context: .
      dockerfile: Dockerfile.credit-exchanger
    ports:
      - "18080:18080"
    volumes:
      - ./docker/credit-exchanger/db-seeding-example.json:/app/credit-exchanger/src/db-seeding-example.json:ro
    environment:
      DB_URI: mongodb://mongodb:27017
      DB_DATABASE: credit_exchanger
      BLACKOUT_CONTROLLER_URL: http://BLACKOUT-SERVICE
      AI_WO_A_CONTROLLER_URL: http://AI-WO-A-SERVICE
      RUN_CREDIT_EXCHANGER_SEED: ${RUN_CREDIT_EXCHANGER_SEED:-false}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/18080'"]
      interval: 5s
      timeout: 2s
      retries: 20

  simulation:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      credit-exchanger:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo-data:
