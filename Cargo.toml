[package]
name = "simulation"
version = "1.2.2"
edition = "2024"
repository = "https://github.com/Dost-2-0-FK/simulation"

[workspace]
members = [".", "crates/simulation-viewer"]
resolver = "3"

[dependencies]
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.11.0"
derive_more = { version = "2.0.1", features = ["into"] }
env_logger = "0.11.8"
log = "0.4.28"
tokio = { version = "1", features = ["fs", "macros", "time"] }
serde = "1"
subtle = "2"
toml = "0.9"
url = { version = "2.5.7", features = ["serde"] }
anyhow = "1"
mongodb = "3"
typed-builder = "0.23.2"
ordered-float = { version = "5", features = ["serde"] }
serde_with = { version = "3", features = ["time_0_3"] }
utoipa-actix-web = "0.1.2"
utoipa = { version = "5.4.0", features = ["actix_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
futures-util = "0.3.32"
rand = "0.10.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
rstar = "0.13.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
serde_json = "1"
